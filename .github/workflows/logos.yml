name: Fetch stock logos
# Downloads the official Robinhood stock-token logos for the listed assets into the repo, so
# the app serves them itself (no third-party requests from users' browsers).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p webapp/app/logos
          for a in $(node -p 'require("./deployments/robinhood.assets.json").assets.map(a=>a.address.toLowerCase()).join(" ")'); do
            curl -fsSL -A "vesper-logos/1.0" -o "webapp/app/logos/$a.png" "https://cdn.robinhood.com/ncw_assets/logos/$a.png" || echo "::warning::no logo for $a"
          done
          ls -la webapp/app/logos
          echo "::notice title=logos::$(ls webapp/app/logos | wc -l) logos"
      - name: Commit
        run: |
          git add webapp/app/logos
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "vesper-bot"
          git config user.email "actions@github.com"
          git commit -m "Stock logos from Robinhood's token list"
          git push
