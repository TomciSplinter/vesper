name: Update sanctions blocklist
# Daily: refreshes asp/blocklist.json from the OFAC sanctions list, commits it if it changed
# (Vercel redeploys), then asks the live screener to republish so newly listed depositors
# lose private withdrawals (they can still exit to their own wallet).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --omit=dev --ignore-scripts
      - id: run
        run: |
          set +e
          node scripts/update-blocklist.js > out.txt 2>&1; code=$?
          echo "::notice title=blocklist::$(tr '\n' ' ' < out.txt)"
          exit $code
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet asp/blocklist.json; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "vesper-blocklist-bot"
          git config user.email "actions@github.com"
          git add asp/blocklist.json
          git commit -m "Update sanctions blocklist ($(node -p 'require("./asp/blocklist.json").length') addresses)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Republish approvals on the live site
        if: steps.commit.outputs.changed == 'yes'
        run: |
          sleep 120   # let Vercel deploy the new list
          r=$(curl -sS -m 60 -X POST https://www.vesper.markets/api/asp-update || true)
          echo "::notice title=asp-update::$r"
