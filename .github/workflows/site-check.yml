name: Check live site
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium
      # GitHub shows at most 10 notices per step, so each check gets its own step.
      - name: Site
        run: |
          node scripts/dev/site-check.mjs > log.txt 2>&1 || true
          head -10 log.txt | while IFS= read -r line; do echo "::notice::$line"; done
      - name: WalletConnect
        run: |
          node scripts/dev/wc-debug.mjs > wc.txt 2>&1 || true
          grep -E "sheet text|requestfailed|pageerror|websocket (open|error)|click failed" wc.txt | head -10 | while IFS= read -r line; do echo "::notice::wc $line"; done
      - name: Result
        run: grep -q "^FAIL" log.txt && exit 1 || exit 0
